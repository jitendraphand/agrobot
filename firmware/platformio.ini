; AgroBot Mk1 firmware - ESP32 DevKit V1 (ESP-WROOM-32, 30 or 38 pin)
;   pio run -t upload        build + flash over USB
;   pio device monitor       serial console (115200 baud) - type HELP-less commands, see docs/firmware.md
; No external libraries: the PCA9685, MPU6050, AHT20 and HC-SR04 drivers are in src/.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=1
build_unflags = -std=gnu++11
build_src_filter = +<*> -<../esp32cam/>
; lib/agro_core/c_api.cpp is only for the simulator
lib_ignore =
lib_ldf_mode = chain
